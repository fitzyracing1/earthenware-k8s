apiVersion: v1
kind: ServiceAccount
metadata: {name: earthenware-scheduler, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: earthenware-scheduler-kube-scheduler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:kube-scheduler"}
subjects: [{kind: ServiceAccount, name: earthenware-scheduler, namespace: kube-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: earthenware-scheduler-volume-scheduler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:volume-scheduler"}
subjects: [{kind: ServiceAccount, name: earthenware-scheduler, namespace: kube-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: earthenware-scheduler-auth-reader, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader}
subjects: [{kind: ServiceAccount, name: earthenware-scheduler, namespace: kube-system}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: earthenware-scheduler-config, namespace: kube-system}
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection: {leaderElect: false}
    profiles:
    - schedulerName: earthenware
      plugins:
        filter: {enabled: [{name: Earthenware}]}
        score:
          enabled: [{name: Earthenware, weight: 10}]
          disabled: [{name: NodeResourcesBalancedAllocation}, {name: NodeResourcesFit}]
      pluginConfig:
      - name: Earthenware
        args: {maxTempC: 85}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: earthenware-scheduler, namespace: kube-system, labels: {app: earthenware-scheduler}}
spec:
  replicas: 1
  selector: {matchLabels: {app: earthenware-scheduler}}
  template:
    metadata: {labels: {app: earthenware-scheduler}}
    spec:
      serviceAccountName: earthenware-scheduler
      containers:
      - name: scheduler
        image: ghcr.io/fitzyracing1/earthenware-scheduler:dev
        command: ["/earthenware-scheduler", "--config=/etc/earthenware/config.yaml", "--v=2"]
        volumeMounts: [{name: config, mountPath: /etc/earthenware}]
        resources: {requests: {cpu: 100m, memory: 128Mi}}
      volumes: [{name: config, configMap: {name: earthenware-scheduler-config}}]
