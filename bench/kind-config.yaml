# Layout follows earthenware-tree tree.json: host subtree C = control-plane (scheduler),
# VM1..VM4 = one worker node group each, linked only to the host. Blocks = pod slots (4,4,2,1 = 11).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  labels: {earthenware.io/vm: C}
- {role: worker, labels: {earthenware.io/vm: VM1}}
- {role: worker, labels: {earthenware.io/vm: VM2}}
- {role: worker, labels: {earthenware.io/vm: VM3}}
- {role: worker, labels: {earthenware.io/vm: VM4}}
